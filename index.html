<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020308">
  <meta name="description" content="Un jardín de flores amarillas para mi Tami. 💛">
  <title>Para mi Tami 💛</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23060e21'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='44'%3E🌼%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme:dark; --gold:#ffdc80; --ivory:#fff3d7; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#020308; }
    body { font-family:Georgia,'Times New Roman',serif; color:var(--ivory); }
    button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
    button:focus-visible { outline:2px solid #ffe29b; outline-offset:7px; }
    #garden { position:fixed; inset:0; width:100%; height:100%; height:100dvh; touch-action:none; outline:none; }
    #intro { position:fixed; inset:0; z-index:5; display:grid; place-items:center; padding:30px; background:#020308; transition:opacity 1.5s ease,visibility 1.5s; }
    #intro.leaving { opacity:0; visibility:hidden; pointer-events:none; }
    .invitation { text-align:center; transform:translateY(-3vh); animation:arrive 1.8s ease both; }
    .little-heart { display:block; font-size:23px; margin-bottom:30px; filter:drop-shadow(0 0 15px #ffd65b55); animation:heartbeat 3.7s ease-in-out infinite; }
    h1 { margin:0; font-weight:400; font-size:clamp(24px,5.8vw,38px); line-height:1.5; letter-spacing:-.025em; color:#e6e0d3; }
    h1 em { display:block; font-size:clamp(52px,12vw,85px); font-weight:400; color:#ffe5a1; line-height:1.25; margin-top:6px; }
    #open { margin-top:43px; border:1px solid #d8ad544d; border-radius:999px; padding:16px 30px; min-height:52px; background:linear-gradient(120deg,#eeb95413,#eeb95405); color:#ffe3a4; font-family:system-ui,sans-serif; font-size:15px; letter-spacing:.025em; box-shadow:0 0 40px #e5b84708,inset 0 0 20px #e5b84703; transition:background .3s,box-shadow .3s,transform .3s; }
    @media(hover:hover) and (pointer:fine) { #open:hover { background:#eeb95418; box-shadow:0 0 42px #e5b8471a; transform:translateY(-2px); } }
    #open span { margin-left:15px; }
    .intro-note { margin-top:24px; font:13px/1.6 system-ui,sans-serif; color:#aaa28b; letter-spacing:.025em; }
    #dedication { position:fixed; pointer-events:none; top:max(65px,13vh); left:18px; right:18px; text-align:center; opacity:0; transform:translateY(12px); transition:opacity 2s,transform 2s; }
    #dedication.visible { opacity:1; transform:translateY(0); }
    #dedication p { margin:0; color:#e7debe; font-size:clamp(17px,3.9vw,23px); }
    #dedication h2 { margin:9px 0 0; font-size:clamp(34px,8vw,56px); line-height:1.15; font-style:italic; font-weight:400; color:#ffdfa0; text-shadow:0 0 32px #ffce5b25; }
    #words { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
    .love-word { position:absolute; width:max-content; max-width:min(320px,calc(100vw - 40px)); text-align:center; font-style:italic; font-size:clamp(18px,4.5vw,24px); line-height:1.4; color:#ffe5a7; text-shadow:0 0 13px #ffd56c55; opacity:0; transform:translate(-50%,0); will-change:transform,opacity; }
    .love-word.loud { color:#ffe333; font-style:normal; font-weight:bold; letter-spacing:.04em; text-shadow:0 0 16px #ffd50065; }
    #controls { position:fixed; z-index:3; bottom:max(18px,env(safe-area-inset-bottom)); left:20px; right:20px; display:flex; align-items:center; justify-content:space-between; gap:12px; opacity:0; visibility:hidden; transition:opacity 1s; }
    #controls.visible { opacity:1; visibility:visible; }
    .quiet-button { display:inline-flex; align-items:center; gap:8px; min-height:44px; border:1px solid #edda9c25; border-radius:25px; background:#07101ab8; padding:10px 15px; font:13px system-ui,sans-serif; color:#e5d9b9; backdrop-filter:blur(10px); }
    .quiet-button:hover { border-color:#edda9c65; }
    .quiet-button svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    #hint { position:fixed; bottom:90px; left:25px; right:25px; text-align:center; font:13px/1.7 system-ui,sans-serif; color:#d8d5b7; pointer-events:none; opacity:0; transition:opacity 1.5s; text-shadow:0 1px 5px #000; }
    #hint.visible { opacity:1; }
    #status { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
    noscript { position:fixed; inset:auto 20px 20px; z-index:9; background:#101622; padding:15px; text-align:center; }
    @keyframes arrive { from {opacity:0;transform:translateY(12px)} to {opacity:1;transform:translateY(-3vh)} }
    @keyframes heartbeat { 0%,100% {transform:scale(1);opacity:.75} 50% {transform:scale(1.1);opacity:1} }
    @keyframes float-word { 0% {opacity:0;transform:translate(-50%,12px) scale(.95)} 22% {opacity:.95} 74% {opacity:.8} 100% {opacity:0;transform:translate(-50%,-48px) scale(1.02)} }
    @media(max-height:560px) and (orientation:landscape) { #dedication {top:28px;left:25px;right:auto;text-align:left} #dedication h2 {font-size:32px} #dedication p {font-size:16px} .little-heart {margin-bottom:12px} h1 em {font-size:48px} #open {margin-top:22px} .intro-note {margin-top:14px} }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after {animation:none!important;transition-duration:.1s!important} }
  </style>
</head>
<body>
  <canvas id="garden" tabindex="-1" role="img" aria-label="Jardín interactivo de flores amarillas bajo un cielo estrellado. Arrastrá para moverlo y tocá para crear destellos."></canvas>
  <section id="intro" aria-label="Una sorpresa para Tami">
    <div class="invitation">
      <span class="little-heart" aria-hidden="true">💛</span>
      <h1>Tengo algo para vos,<em>mi Tami</em></h1>
      <button id="open">Descubrilo <span aria-hidden="true">✧</span></button>
      <p class="intro-note">Un regalito hecho con amor.</p>
    </div>
  </section>
  <header id="dedication" aria-hidden="true"><p>Todas estas flores son</p><h2>para vos, mi Tami.</h2></header>
  <div id="words" aria-hidden="true"></div>
  <p id="hint">Arrastrá para mover el jardín.<br>Tocá las flores ✨</p>
  <nav id="controls" aria-label="Controles del jardín" inert>
    <button class="quiet-button" id="replay" aria-label="Volver a ver la sorpresa"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 7a7 7 0 1 1-1 6M4 2v5h5"/></svg>Otra vez</button>
    <button class="quiet-button" id="pause" aria-label="Pausar animaciones" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path id="pause-icon" d="M7 4v12M13 4v12"/></svg><span id="pause-label">Pausar</span></button>
  </nav>
  <p id="status" aria-live="polite"></p>
  <noscript>Para ver las flores, activá JavaScript y abrí esta página en Chrome o Safari. 💛</noscript>
  <script>
  (() => {
    'use strict';

    // PERSONALIZACIÓN: mensajes, colores y tiempos del regalo.
    const CONFIG = {
      messages: ['Te amo', 'te amu muto', 'Te adoro', 'muuuuuuaaaaaaa', 'Mi Tamarita <3', 'sos el amor de mi vida', '💛', 'sos mi meme hemosha', '🌼', 'te quiero para mi solo', 'TE AMUUU', 'Te amo, mi Tami', '🌻', '💛 ✨'],
      bloomSeconds: 6.8,
      maxParticles: 180,
      phraseEvery: 3.4
    };
    const $ = id => document.getElementById(id);
    const canvas = $('garden'), ctx = canvas.getContext('2d', {alpha:false});
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W=0,H=0,DPR=1,span=0,started=false,paused=false,elapsed=0,lastFrame=0,raf=0;
    let messageClock=0,messageIndex=0,lastTrail=0,drag=null,uiStage=0,pendingWord=null;
    const camera={x:0,y:0,targetX:0,targetY:0};
    const particles=[], words=[], flowers=[];
    const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
    const ease=n=>{n=clamp(n,0,1);return n*n*(3-2*n)};
    function random(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
    const rnd=random(2109);
    const stars=Array.from({length:370},()=>({x:rnd(),y:rnd()*.88,r:.18+Math.pow(rnd(),2)*.7,phase:rnd()*6.28,speed:.25+rnd()*.55,alpha:.15+rnd()*.55}));
    const flies=Array.from({length:46},()=>({x:rnd(),y:.22+rnd()*.67,z:.35+rnd()*.8,phase:rnd()*6.28,speed:.2+rnd()*.45}));
    const grass=Array.from({length:58},()=>({x:rnd(),h:.04+rnd()*.2,bend:(rnd()-.5)*.12,phase:rnd()*6.28}));
    let backdrop, woodland;

    // Se dibuja cada corola una sola vez y se reutiliza durante la animación.
    // Esto evita cargar imágenes, librerías o fuentes externas.
    function createCorolla(seed) {
      const rand=random(seed), c=document.createElement('canvas'); c.width=c.height=360;
      const g=c.getContext('2d');g.translate(180,180);
      const halo=g.createRadialGradient(0,0,15,0,0,174);
      halo.addColorStop(0,'#ffca3917');halo.addColorStop(.57,'#ffd44a15');halo.addColorStop(1,'#ffcb4000');
      g.fillStyle=halo;g.fillRect(-180,-180,360,360);
      for(let layer=0;layer<2;layer++) {
        const count=layer?13:12;
        for(let i=0;i<count;i++) {
          g.save();g.rotate(i/count*Math.PI*2+(layer?.14:0)+(rand()-.5)*.055);
          const length=(layer?121:136)*(0.88+rand()*.13),width=(layer?25:26)*(0.85+rand()*.25);
          g.beginPath();g.moveTo(-5,13);
          g.bezierCurveTo(-width,-length*.22,-width*1.2,-length*.76,-width*.6,-length*.94);
          g.bezierCurveTo(-width*.2,-length*1.07,width*.68,-length*1.025,width*.89,-length*.88);
          g.bezierCurveTo(width*1.16,-length*.65,width*.49,-length*.12,6,13);
          const petal=g.createLinearGradient(-width,-length*.4,width,-length*.7);
          petal.addColorStop(0,layer?'#d58e09':'#bd7805');petal.addColorStop(.28,'#fbc72e');petal.addColorStop(.58,layer?'#ffe877':'#ffd54e');petal.addColorStop(.86,'#f7b918');petal.addColorStop(1,'#df9005');
          g.fillStyle=petal;g.fill();
          g.strokeStyle='#ffe9986b';g.lineWidth=.9;g.stroke();
          g.beginPath();g.moveTo(0,-25);g.quadraticCurveTo(-4,-length*.58,2,-length*.91);
          g.strokeStyle='#fff4b958';g.lineWidth=1.1;g.stroke();
          g.beginPath();g.moveTo(-6,-26);g.quadraticCurveTo(-13,-length*.5,-8,-length*.82);
          g.strokeStyle='#ad700329';g.lineWidth=.8;g.stroke();g.restore();
        }
      }
      g.save();g.shadowColor='#684005';g.shadowBlur=8;
      const middle=g.createRadialGradient(-9,-10,2,0,0,32);
      middle.addColorStop(0,'#bd7e16');middle.addColorStop(.55,'#9b5b0d');middle.addColorStop(.87,'#653909');middle.addColorStop(1,'#e0a72d');
      g.fillStyle=middle;g.beginPath();g.arc(0,0,32,0,Math.PI*2);g.fill();g.restore();
      for(let i=0;i<330;i++) {
        const a=i*2.39996,r=Math.sqrt(i/330)*29;
        g.fillStyle=i%4===0?'#ffe092':i%3===0?'#e4b143':'#bd892c';
        g.beginPath();g.ellipse(Math.cos(a)*r,Math.sin(a)*r,1.1,1.45,a,0,Math.PI*2);g.fill();
      }
      return c;
    }
    function createPoppy(seed) {
      const rand=random(seed), c=document.createElement('canvas');c.width=c.height=360;
      const g=c.getContext('2d');g.translate(180,180);
      for(let i=0;i<4;i++) {
        g.save();g.rotate(i*Math.PI*2/4+.17);
        const l=108+rand()*20;
        g.beginPath();g.moveTo(-9,16);
        g.bezierCurveTo(-49,-7,-99,-65,-68,-l*.85);
        g.bezierCurveTo(-50,-l*1.12,-27,-l*.98,-7,-l*1.05);
        g.bezierCurveTo(12,-l*1.2,35,-l*.97,53,-l*.93);
        g.bezierCurveTo(103,-l*.76,66,-17,9,16);
        const petal=g.createRadialGradient(2,-10,8,-5,-65,96);
        petal.addColorStop(0,'#c68706');petal.addColorStop(.34,'#efb715');petal.addColorStop(.74,'#ffdd4e');petal.addColorStop(1,'#fff19b');
        g.fillStyle=petal;g.fill();g.strokeStyle='#ffeaa46b';g.lineWidth=1;g.stroke();
        for(let j=0;j<9;j++) {const a=(j-4)*.17;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(Math.sin(a)*67,-l*.45,Math.sin(a)*95,-l*.9+Math.abs(j-4)*3);g.strokeStyle=j%2?'#fff8ca30':'#9f6d061a';g.lineWidth=.8;g.stroke()}
        g.restore();
      }
      g.fillStyle='#657342';g.beginPath();g.arc(0,0,14,0,Math.PI*2);g.fill();
      for(let i=0;i<32;i++){const a=i/32*Math.PI*2;g.strokeStyle='#815c13';g.lineWidth=1.3;g.beginPath();g.moveTo(Math.cos(a)*11,Math.sin(a)*11);g.lineTo(Math.cos(a)*25,Math.sin(a)*25);g.stroke();g.fillStyle='#e6b330';g.beginPath();g.arc(Math.cos(a)*25,Math.sin(a)*25,2.4,0,Math.PI*2);g.fill()}
      g.strokeStyle='#ccd282';g.lineWidth=1;for(let i=0;i<7;i++){const a=i/7*Math.PI*2;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a)*11,Math.sin(a)*11);g.stroke()}
      return c;
    }
    const corollas=[createCorolla(12),createCorolla(35),createCorolla(79)], poppies=[createPoppy(22),createPoppy(61)];
    const glow=document.createElement('canvas');glow.width=glow.height=64;
    const gg=glow.getContext('2d'), gr=gg.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0,'#ffffcf');gr.addColorStop(.055,'#fff3ac');gr.addColorStop(.16,'#ffde6e9c');gr.addColorStop(.4,'#eebd2b20');gr.addColorStop(1,'#eebd2b00');gg.fillStyle=gr;gg.fillRect(0,0,64,64);

    // x: posición relativa al ancho del ramo. y: altura de la flor abierta.
    // z: profundidad; las flores cercanas responden más al movimiento.
    const layout=[
      [-.39,.63,.62,.76,-.24], [.35,.60,.63,.76,.25],
      [-.25,.48,.72,.88,-.17], [.22,.43,.70,.86,.15],
      [-.08,.38,.80,1.04,-.12], [.06,.58,.82,.90,.2],
      [-.37,.76,.82,.74,-.4], [.38,.75,.85,.76,.34],
      [-.20,.64,1,1.12,-.13], [.22,.65,1,1.1,.15],
      [.045,.49,1.1,1.24,.055]
    ];
    layout.forEach((v,i)=>flowers.push({x:v[0],y:v[1],z:v[2],size:v[3],angle:v[4],delay:(i%5)*.27+(i<4?.3:0),phase:i*1.83,sprite:corollas[i%3],hitX:0,hitY:0,hitR:0,shine:0}));

    [[-.30,.85,.60,-.22],[-.10,.79,.70,.12],[.09,.87,.76,-.16],[.31,.83,.62,.19],[-.42,.91,.44,-.30],[.43,.90,.44,.3]].forEach((v,i)=>flowers.push({x:v[0],y:v[1],z:1.2,size:v[2],angle:v[3],delay:.5+(i%3)*.23,phase:22+i*1.7,sprite:poppies[i%2],poppy:true,hitX:0,hitY:0,hitR:0,shine:0}));

    // El fondo se prepara una vez por tamaño de pantalla, no en cada cuadro.
    function paintGalaxy(b){
      const rand=random(420);b.save();b.translate(W*.73,H*.28);b.rotate(-.45);
      const r=Math.min(W*.2,115);b.scale(1,.42);
      const mist=b.createRadialGradient(0,0,0,0,0,r);mist.addColorStop(0,'#c4c6e01c');mist.addColorStop(.25,'#9b93c516');mist.addColorStop(.7,'#73699e09');mist.addColorStop(1,'#73699e00');b.fillStyle=mist;b.fillRect(-r,-r,r*2,r*2);
      for(let i=0;i<950;i++){const d=Math.pow(rand(),.7)*r,a=d/r*6.5+(i%2)*Math.PI+(rand()-.5)*.9,x=Math.cos(a)*d,y=Math.sin(a)*d;b.fillStyle='rgba(184,183,225,'+(.012+rand()*.10)*(1-d/r)+')';b.beginPath();b.arc(x,y,.25+rand()*.7,0,Math.PI*2);b.fill()}
      b.restore();
    }
    function paintWoodland(){
      woodland=document.createElement('canvas');woodland.width=canvas.width;woodland.height=canvas.height;
      const b=woodland.getContext('2d');b.scale(DPR,DPR);
      // Árboles distantes y separados del primer plano, con sus propias ramas.
      function tree(x,y,height,seed){
        const rand=random(seed);b.save();b.translate(x,y);
        function branch(x,y,len,angle,width,level){
          const tx=x+Math.sin(angle)*len,ty=y-Math.cos(angle)*len;
          b.strokeStyle=level>3?'#0b202bd9':'#102c35c9';b.lineWidth=width;b.lineCap='round';b.beginPath();b.moveTo(x,y);b.quadraticCurveTo(x+Math.sin(angle+.12)*len*.55,y-Math.cos(angle+.12)*len*.55,tx,ty);b.stroke();
          if(level>0){branch(tx,ty,len*(.66+rand()*.1),angle-.35-rand()*.25,width*.65,level-1);branch(tx,ty,len*(.64+rand()*.1),angle+.33+rand()*.3,width*.64,level-1)}
          else {for(let j=0;j<8;j++){b.fillStyle=j%2?'#102c34c7':'#15333b9c';b.beginPath();b.ellipse(tx+(rand()-.5)*height*.17,ty+(rand()-.5)*height*.12,height*(.025+rand()*.035),height*(.025+rand()*.023),rand()*3,0,Math.PI*2);b.fill()}}
        }
        branch(0,0,height*.38,(rand()-.5)*.12,height*.025,5);b.restore();
      }
      tree(W*.055,H*.94,Math.min(H*.43,W*.65),38);tree(W*.94,H*.93,Math.min(H*.38,W*.58),92);
      const fog=b.createLinearGradient(0,H*.72,0,H);fog.addColorStop(0,'#16313b00');fog.addColorStop(.55,'#15333b30');fog.addColorStop(1,'#040d1300');b.fillStyle=fog;b.fillRect(0,H*.72,W,H*.28);
    }
    function resize(){
      W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,1.75);span=Math.min(W*.95,H*.85,740);
      canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';
      ctx.setTransform(DPR,0,0,DPR,0,0);
      backdrop=document.createElement('canvas');backdrop.width=canvas.width;backdrop.height=canvas.height;
      const b=backdrop.getContext('2d');b.scale(DPR,DPR);
      const bg=b.createLinearGradient(0,0,W*.3,H);bg.addColorStop(0,'#030714');bg.addColorStop(.42,'#091a35');bg.addColorStop(.78,'#0a222a');bg.addColorStop(1,'#040d13');b.fillStyle=bg;b.fillRect(0,0,W,H);
      let halo=b.createRadialGradient(W*.5,H*.68,0,W*.5,H*.68,span*.75);halo.addColorStop(0,'#d4c55710');halo.addColorStop(.5,'#3f957815');halo.addColorStop(1,'#13233800');b.fillStyle=halo;b.fillRect(0,0,W,H);
      const rand=random(55);for(let i=0;i<600;i++){const x=rand()*W,y=rand()*H;b.fillStyle='rgba(189,203,225,'+(rand()*.035)+')';b.fillRect(x,y,.7,.7)}
      paintGalaxy(b);paintWoodland();
      words.forEach(w=>placeWord(w));
      render();
    }

    function starField(t,reveal){
      for(const s of stars){
        const x=s.x*W+camera.x*8,y=s.y*H+camera.y*5;
        const a=(s.alpha+Math.sin(t*s.speed+s.phase)*.13)*reveal;
        ctx.globalAlpha=Math.max(0,a);ctx.fillStyle='#d9e8ff';ctx.beginPath();ctx.arc(x,y,s.r,0,Math.PI*2);ctx.fill();
        if(s.r>.8){ctx.strokeStyle='#ccddff45';ctx.lineWidth=.45;ctx.beginPath();ctx.moveTo(x-1.9,y);ctx.lineTo(x+1.9,y);ctx.moveTo(x,y-1.9);ctx.lineTo(x,y+1.9);ctx.stroke()}
      }ctx.globalAlpha=1;
    }
    function leaf(x,y,length,angle,alpha){
      ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.globalAlpha*=alpha;
      ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-length*.06,-length*.38,length*.32,-length*.83,length*.12,-length);ctx.bezierCurveTo(length*.81,-length*.56,length*.54,-length*.11,0,0);
      const l=ctx.createLinearGradient(0,0,length*.4,-length);l.addColorStop(0,'#0a4235');l.addColorStop(.5,'#287252');l.addColorStop(1,'#70a75e');ctx.fillStyle=l;ctx.fill();
      ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(length*.32,-length*.5,length*.12,-length*.92);ctx.strokeStyle='#9bbe6766';ctx.lineWidth=.7;ctx.stroke();ctx.restore();
    }
    function drawFlower(f,t){
      const growth=ease((elapsed-f.delay-.5)/3.5),bloom=ease((elapsed-f.delay-2.8)/2.8);
      if(!growth)return;
      const sway=reduced?0:Math.sin(t*.55+f.phase)*span*.009*f.z;
      const baseX=W/2+f.x*span*.43+camera.x*span*.07*f.z,baseY=H*1.065+camera.y*18;
      const headX=W/2+f.x*span+sway+camera.x*span*.105*f.z;
      const headY=H*f.y+camera.y*span*.045*f.z+(reduced?0:Math.sin(t*.5+f.phase)*2.5);
      const topX=baseX+(headX-baseX)*growth,topY=baseY+(headY-baseY)*growth;
      const stem=ctx.createLinearGradient(baseX,baseY,topX,topY);stem.addColorStop(0,'#103b30');stem.addColorStop(.7,'#398553');stem.addColorStop(1,'#8bb45d');
      ctx.strokeStyle=stem;ctx.lineWidth=span*(f.poppy?.003:.006)*f.z;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(baseX,baseY);ctx.bezierCurveTo(baseX-span*.05*f.x,baseY-(baseY-topY)*.5,topX+span*.09*f.x,topY+(baseY-topY)*.36,topX,topY);ctx.stroke();
      for(let j=0;j<3;j++){
        const k=.27+j*.2,lg=ease((growth-k)/.3);if(!lg)continue;
        const lx=baseX+(topX-baseX)*k,ly=baseY+(topY-baseY)*k;
        const side=(j+(f.phase>6?1:0))%2===0?1:-1;
        leaf(lx,ly,span*(f.poppy?.045:.11-j*.016)*f.size*lg,side*(.85+j*.1),.9);
      }
      const radius=span*.12*f.size;
      ctx.save();ctx.translate(topX,topY);ctx.rotate(f.angle+(reduced?0:Math.sin(t*.55+f.phase)*.035));
      ctx.scale(.13+.87*bloom,.23+.77*bloom);
      if(f.shine>0){ctx.globalAlpha=f.shine*.65;ctx.drawImage(glow,-radius*1.9,-radius*1.9,radius*3.8,radius*3.8);ctx.globalAlpha=1}
      ctx.drawImage(f.sprite,-radius,-radius,radius*2,radius*2);ctx.restore();
      f.hitX=topX;f.hitY=topY;f.hitR=radius*.8*bloom;
    }
    function drawGrass(t){
      const growth=ease((elapsed-1)/4);ctx.lineCap='round';
      for(const a of grass){
        const x=W/2+(a.x-.5)*span*1.5+camera.x*span*.045,y=H*1.04;
        const h=H*a.h*growth;
        const wave=reduced?0:Math.sin(t*.5+a.phase)*8;
        ctx.strokeStyle=a.x>.5?'#32624b65':'#386f4e65';ctx.lineWidth=1.4;
        ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+a.bend*span*.25,y-h*.7,x+a.bend*span+wave,y-h);ctx.stroke();
      }
    }
    function drawFlies(t,reveal){
      ctx.globalCompositeOperation='screen';
      for(const f of flies){
        const x=f.x*W+Math.sin(t*f.speed+f.phase)*25+camera.x*25*f.z;
        const y=f.y*H+Math.cos(t*f.speed*.65+f.phase)*20+camera.y*12*f.z;
        const alpha=(.25+.75*Math.pow((Math.sin(t*1.3+f.phase)+1)/2,2))*reveal;
        const size=16*f.z+7;ctx.globalAlpha=alpha;ctx.drawImage(glow,x-size/2,y-size/2,size,size);
      }ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    }
    function drawParticles(){
      ctx.globalCompositeOperation='screen';
      for(const p of particles){const life=p.life/p.max;ctx.globalAlpha=Math.min(1,life*2);const size=p.size*(.4+life*.6);ctx.drawImage(glow,p.x-size/2,p.y-size/2,size,size)}
      ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    }
    function render(){
      ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#020308';ctx.fillRect(0,0,W,H);
      if(!started||!backdrop)return;
      const reveal=ease(elapsed/2.5),t=reduced?8:elapsed;
      ctx.globalAlpha=reveal;ctx.drawImage(backdrop,0,0,W,H);ctx.globalAlpha=1;
      starField(t,reveal);ctx.globalAlpha=reveal*.7;ctx.drawImage(woodland,camera.x*7,camera.y*3,W,H);ctx.globalAlpha=1;drawGrass(t);for(const f of flowers)drawFlower(f,t);
      // Un degradado en primer plano funde los tallos con la noche.
      const fade=ctx.createLinearGradient(0,H*.88,0,H);fade.addColorStop(0,'#03091000');fade.addColorStop(1,'#030910ed');ctx.fillStyle=fade;ctx.fillRect(0,H*.88,W,H*.12);
      drawFlies(t,reveal);drawParticles();
    }
    function tick(now){
      raf=0;if(!started||paused||document.hidden){lastFrame=0;return}
      const dt=lastFrame?Math.min((now-lastFrame)/1000,.05):0;lastFrame=now;elapsed+=dt;
      if(!drag){camera.targetX*=Math.exp(-dt*1.2);camera.targetY*=Math.exp(-dt*1.2)}
      const smooth=1-Math.exp(-dt*5);camera.x+=(camera.targetX-camera.x)*smooth;camera.y+=(camera.targetY-camera.y)*smooth;
      for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=dt*3;if(p.life<=0)particles.splice(i,1)}
      for(const f of flowers)f.shine=Math.max(0,f.shine-dt*.55);
      updateWords(dt);
      if(elapsed>4.2&&uiStage===0){$('dedication').classList.add('visible');$('dedication').setAttribute('aria-hidden','false');uiStage=1}
      if(elapsed>CONFIG.bloomSeconds&&uiStage===1){$('controls').classList.add('visible');$('controls').inert=false;$('hint').classList.add('visible');$('status').textContent='Tu jardín ya floreció. Tocá las flores o arrastrá para explorar.';uiStage=2;showWord(W*.26,H*.35,'Te amo')}
      if(elapsed>16)$('hint').classList.remove('visible');
      if(elapsed>7&&!reduced&&!words.length&&!pendingWord){messageClock+=dt;if(messageClock>CONFIG.phraseEvery){messageClock=0;const positions=[[.77,.35],[.2,.52],[.75,.78],[.28,.32],[.74,.53],[.25,.76]];const pos=positions[messageIndex%positions.length];showWord(W*pos[0],H*pos[1])}}
      render();raf=requestAnimationFrame(tick);
    }
    function wake(){if(!raf&&started&&!paused&&!document.hidden){lastFrame=0;raf=requestAnimationFrame(tick)}}
    function placeWord(w){
      const box=w.el.getBoundingClientRect(),half=box.width/2+20;
      w.el.style.left=clamp(w.x,half,W-half)+'px';
      w.el.style.top=clamp(w.y,Math.min(H*.3,230),H-125-box.height)+'px';
    }
    function mountWord(next){
      const el=document.createElement('span');el.className='love-word'+(next.text==='TE AMUUU'?' loud':'');el.textContent=next.text;el.style.opacity='0';$('words').append(el);
      const word={el,x:next.x,y:next.y,age:0,alpha:0,exit:null};words.push(word);placeWord(word);messageClock=0;
    }
    function showWord(x,y,text){
      const next={x,y,text:text??CONFIG.messages[messageIndex++%CONFIG.messages.length]};
      if(!words.length){mountWord(next);return}
      // Sólo una frase visible. Si llegan muchos toques, se conserva el último.
      pendingWord=next;
      const current=words[0];if(current.age>=1.2&&current.exit===null)current.exit={time:0,alpha:current.alpha};
    }
    function updateWords(dt){
      const w=words[0];if(!w)return;
      w.age+=dt;
      if(w.exit===null&&((pendingWord&&w.age>=1.2)||w.age>=3.8))w.exit={time:0,alpha:w.alpha};
      if(w.exit!==null){w.exit.time+=dt;w.alpha=w.exit.alpha*(1-ease(w.exit.time/.9))}
      else w.alpha=ease(w.age/1.2)*.96;
      w.el.style.opacity=String(w.alpha);
      w.el.style.transform='translate(-50%,'+(reduced?0:-Math.min(w.age,5)*3)+'px)';
      if(w.exit!==null&&w.exit.time>=.9){w.el.remove();words.length=0;if(pendingWord){const next=pendingWord;pendingWord=null;mountWord(next)}}
    }
    function spark(x,y,count=22){
      if(reduced)return;
      for(let i=0;i<count;i++){const angle=Math.random()*Math.PI*2,speed=10+Math.random()*55,life=1.1+Math.random()*1.8;particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-10,life,max:life,size:10+Math.random()*17})}
      if(particles.length>CONFIG.maxParticles)particles.splice(0,particles.length-CONFIG.maxParticles);
    }
    function start(){
      if(started)return;
      started=true;elapsed=reduced?7:0;paused=false;uiStage=0;messageClock=0;
      $('intro').classList.add('leaving');$('intro').style.pointerEvents='none';
      $('status').textContent='Está floreciendo un jardín para vos, mi Tami.';
      wake();
      try{$('garden').focus({preventScroll:true})}catch(e){}
      $('intro').inert=true;
    }
    function restart(){
      if(raf)cancelAnimationFrame(raf);raf=0;started=false;paused=false;elapsed=0;lastFrame=0;uiStage=0;
      particles.length=0;words.forEach(w=>w.el.remove());words.length=0;pendingWord=null;messageIndex=0;drag=null;
      Object.assign(camera,{x:0,y:0,targetX:0,targetY:0});flowers.forEach(f=>f.shine=0);
      $('intro').classList.remove('leaving');$('intro').style.pointerEvents='';$('intro').inert=false;$('dedication').classList.remove('visible');$('dedication').setAttribute('aria-hidden','true');$('controls').classList.remove('visible');$('controls').inert=true;$('hint').classList.remove('visible');setPauseUI();render();$('open').focus({preventScroll:true});
    }
    function setPauseUI(){
      $('pause').setAttribute('aria-pressed',String(paused));$('pause').setAttribute('aria-label',paused?'Reanudar animaciones':'Pausar animaciones');$('pause-label').textContent=paused?'Seguir':'Pausar';$('pause-icon').setAttribute('d',paused?'M6 3l10 7-10 7z':'M7 4v12M13 4v12');
      words.forEach(w=>w.el.style.animationPlayState=paused?'paused':'running');
    }
    // Activación táctil explícita: no depender del clic sintetizado del navegador.
    function openFromTap(e){
      if(e.type==='pointerup'&&e.pointerType==='mouse')return;
      if(e.type==='touchend'&&e.touches&&e.touches.length)return;
      if(e.cancelable)e.preventDefault();start();
    }
    $('open').addEventListener('click',start);
    $('open').addEventListener('pointerup',openFromTap);
    $('open').addEventListener('touchend',openFromTap,{passive:false});
    $('replay').addEventListener('click',restart);
    $('pause').addEventListener('click',()=>{paused=!paused;setPauseUI();if(paused){cancelAnimationFrame(raf);raf=0;lastFrame=0}else wake()});
    canvas.addEventListener('pointerdown',e=>{
      if(!started||paused||elapsed<2.5||drag)return;
      drag={id:e.pointerId,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove',e=>{
      if(!drag||drag.id!==e.pointerId||paused)return;
      const dx=e.clientX-drag.lastX,dy=e.clientY-drag.lastY;
      if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7)drag.moved=true;
      camera.targetX=clamp(camera.targetX+dx/W*3,-1,1);camera.targetY=clamp(camera.targetY+dy/H*3,-1,1);
      drag.lastX=e.clientX;drag.lastY=e.clientY;
      if(drag.moved&&elapsed-lastTrail>.045&&!reduced){spark(e.clientX,e.clientY,3);lastTrail=elapsed}
    });
    function release(e){
      if(!drag||drag.id!==e.pointerId)return;
      if(!drag.moved&&e.type!=='pointercancel'&&!paused){
        let hit=null;for(let i=flowers.length-1;i>=0;i--){const f=flowers[i];if(Math.hypot(e.clientX-f.hitX,e.clientY-f.hitY)<f.hitR+10){hit=f;break}}
        if(hit){hit.shine=1;spark(hit.hitX,hit.hitY,35);showWord(hit.hitX,hit.hitY-55)}
        else{spark(e.clientX,e.clientY,18);if(elapsed>6)showWord(e.clientX,e.clientY-25)}
      }drag=null;
    }
    canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',()=>drag=null);
    document.addEventListener('keydown',e=>{
      if(!started||paused||e.target.tagName==='BUTTON')return;
      if(e.key.startsWith('Arrow')){e.preventDefault();camera.targetX=clamp(camera.targetX+(e.key==='ArrowLeft'?-.3:e.key==='ArrowRight'?.3:0),-1,1);camera.targetY=clamp(camera.targetY+(e.key==='ArrowUp'?-.3:e.key==='ArrowDown'?.3:0),-1,1);spark(W/2,H*.6,5)}
      if(e.key==='Enter'||e.key===' '){e.preventDefault();const f=flowers[flowers.length-1];f.shine=1;spark(f.hitX,f.hitY);showWord(f.hitX,f.hitY-55)}
    });
    document.addEventListener('visibilitychange',()=>{words.forEach(w=>w.el.style.animationPlayState=document.hidden||paused?'paused':'running');if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;lastFrame=0;drag=null}else wake()});
    window.addEventListener('resize',resize);resize();
  })();
  </script>
</body>
